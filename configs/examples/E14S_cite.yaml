# Example: E14S GEM-X CITE-seq (no OCM) — GEX + ADT merge
sample: E14S
outdir: /ix1/ylee/kor11/tools/XYZeqV2/examples/E14S_run

paths:
  conda_bin: /ix1/ylee/kor11/tools/af_tutorial/conda_env/bin
  alevin_fry_home: /ix1/ylee/kor11/tools/af_tutorial/E14S_simpleaf/af_home

indices:
  gex: /ix1/ylee/kor11/tools/af_tutorial/E14S_simpleaf/mouse-2024-A_splici/index
  adt: /ix1/ylee/kor11/tools/af_tutorial/E14S_simpleaf/adt_feature_index/index

fastq:
  gex:
    r1: /ix1/ylee/shared/E14S/E14S_GEX_S1_R1_001.fastq.gz
    r2: /ix1/ylee/shared/E14S/E14S_GEX_S1_R2_001.fastq.gz
  adt:
    r1: /ix1/ylee/shared/E14S/E14S_ADT_S2_R1_001.fastq.gz
    r2: /ix1/ylee/shared/E14S/E14S_ADT_S2_R2_001.fastq.gz

inputs:
  gex_h5ad: /ix1/ylee/kor11/tools/af_tutorial/E14S_simpleaf/gex_quant/af_quant/alevin/quants.h5ad
  adt_h5ad: /ix1/ylee/kor11/tools/af_tutorial/E14S_simpleaf/adt_quant/af_quant/alevin/quants.h5ad

feature_ref: /ix1/ylee/kor11/cellranger/ref/feature_reference_spatial.csv

chemistry:
  gex: 10xv4-3p
  adt: e14s-adt-10xv4

quant:
  threads: 112
  min_reads: 10
  resolution: cr-like
  min_gex_umi: 100

ocm:
  enabled: false
