# Copy this for a new GEM-X / XYZeq sample.
sample: SAMPLE_ID
outdir: /path/to/outdir

paths:
  conda_bin: /path/to/conda_env/bin
  alevin_fry_home: /path/to/alevin_fry_home
  # scratch: /scratch/$USER/sample_run

indices:
  gex: /path/to/splici/index
  adt: /path/to/adt_feature_index/index   # optional

fastq:
  gex:
    r1: /path/to/GEX_R1.fastq.gz
    r2: /path/to/GEX_R2.fastq.gz
  adt:
    r1: /path/to/ADT_R1.fastq.gz
    r2: /path/to/ADT_R2.fastq.gz

# Optional: for --skip-quant / demux-only reuse
# inputs:
#   gex_h5ad: /path/to/quants.h5ad
#   adt_h5ad: /path/to/quants.h5ad

feature_ref: /path/to/feature_ref.csv

chemistry:
  gex: 10xv4-3p
  # Registered in af_home as e14s-adt-10xv4 (= GEM-X ADT: 1{b[16]u[12]x:}2{r[15]x:})
  adt: e14s-adt-10xv4

quant:
  threads: 64
  min_reads: 10
  resolution: cr-like
  min_gex_umi: 100

ocm:
  enabled: true
  min_gex_umi: 500
  overhang_start: 7
  overhang_len: 2
  # cellranger_per_sample_outs: /path/to/per_sample_outs
  sample_map:
    - overhang: GT
      ocm_id: OB1
      sample_id: sample_ob1
      description: OB1
    - overhang: CA
      ocm_id: OB2
      sample_id: sample_ob2
      description: OB2
    - overhang: TC
      ocm_id: OB3
      sample_id: sample_ob3
      description: OB3
    - overhang: AG
      ocm_id: OB4
      sample_id: sample_ob4
      description: OB4
