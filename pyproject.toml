[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleleaf"
version = "0.1.0"
description = "Config-driven simpleaf + OCM workflows for GEM-X / XYZeq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scanpy",
  "anndata",
]

[project.scripts]
simpleleaf = "simpleleaf.cli:main"

[tool.setuptools.packages.find]
include = ["simpleleaf*"]
